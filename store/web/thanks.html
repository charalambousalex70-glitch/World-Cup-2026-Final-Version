<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<style>
  :root{--bg:#fbfbfc;--surface:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;
        --accent:#1f6feb;--ok:#0f7b3f;
        --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05)}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1115;--surface:#171a21;--ink:#e8eaed;--muted:#9aa3af;
          --line:#262b35;--accent:#4c8dff;--ok:#4ade80;
          --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3)}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:620px;margin:0 auto;padding:48px 20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
        padding:32px;box-shadow:var(--shadow)}
  .tick{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;
        display:grid;place-items:center;font-size:1.9rem;margin:0 auto 18px}
  h1{margin:0 0 8px;font-size:1.5rem;text-align:center}
  .sub{text-align:center;color:var(--muted);margin:0 0 26px}
  .num{text-align:center;font-size:1.3rem;font-weight:700;letter-spacing:.06em;
       background:var(--bg);border:1px dashed var(--line);border-radius:12px;
       padding:14px;margin-bottom:26px}
  .row{display:flex;justify-content:space-between;padding:10px 0;
       border-bottom:1px solid var(--line)}
  .row:last-of-type{border-bottom:0}
  .tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;
       padding-top:14px;margin-top:6px;border-top:2px solid var(--line)}
  .muted{color:var(--muted);font-size:.9rem}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--accent);
       color:#fff;border-radius:10px;padding:14px;font-weight:600;margin-top:26px}
  .pend{background:#fff8e1;color:#8a6100;border-radius:10px;padding:12px;
        font-size:.9rem;margin-bottom:18px}
  @media (prefers-color-scheme:dark){.pend{background:#3a2f10;color:#fde68a}}
  .addr{background:var(--bg);border-radius:10px;padding:14px;margin-top:20px;
        font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <p class="sub" id="loading">Confirming your payment…</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SYMBOL = "£";
  function money(p) { return SYMBOL + (p / 100).toFixed(2); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get("session_id");
  var card = document.getElementById("card");

  if (!sessionId) {
    render(null);
    return;
  }

  // The webhook that marks an order paid can land a moment after the customer
  // does, so poll briefly rather than declaring the payment unconfirmed.
  var tries = 0;
  (function poll() {
    fetch("/api/v1/orders/by-session/" + encodeURIComponent(sessionId))
      .then(function (r) {
        if (!r.ok) throw new Error("not yet");
        return r.json();
      })
      .then(function (order) {
        if (order.status === "pending" && tries < 6) {
          tries++;
          return setTimeout(poll, 1000);
        }
        render(order);
      })
      .catch(function () {
        if (tries < 6) { tries++; return setTimeout(poll, 1000); }
        render(null);
      });
  })();

  function render(order) {
    card.textContent = "";

    if (!order) {
      card.appendChild(el("h1", null, "Thank you"));
      card.appendChild(el("p", "sub",
        "We couldn't load your order just now, but if your payment went " +
        "through you'll get a confirmation email shortly."));
      var back0 = el("a", "btn", "Back to the shop");
      back0.href = "/";
      card.appendChild(back0);
      return;
    }

    // Payment succeeded, so the cart has done its job.
    try {
      localStorage.removeItem("store.cart.v1");
      sessionStorage.removeItem("store.pendingOrder");
    } catch (e) {}

    card.appendChild(el("div", "tick", "✓"));
    card.appendChild(el("h1", null, "Thank you for your order"));
    card.appendChild(el("p", "sub", "We've sent a confirmation to " + order.email));

    if (order.status === "pending") {
      card.appendChild(el("div", "pend",
        "Your payment is still being confirmed. This page will be accurate " +
        "within a minute or two — no need to pay again."));
    }

    card.appendChild(el("div", "num", order.order_number));
    card.appendChild(el("p", "muted",
      "Keep this number — you can check your order any time at /orders"));

    order.items.forEach(function (i) {
      var row = el("div", "row");
      row.appendChild(el("span", null, i.qty + " × " + i.name));
      row.appendChild(el("span", null, money(i.line_total_cents)));
      card.appendChild(row);
    });

    var ship = el("div", "row");
    ship.appendChild(el("span", "muted", "Shipping"));
    ship.appendChild(el("span", "muted",
      order.shipping_cents === 0 ? "Free" : money(order.shipping_cents)));
    card.appendChild(ship);

    var tot = el("div", "tot");
    tot.appendChild(el("span", null, "Total paid"));
    tot.appendChild(el("span", null, money(order.total_cents)));
    card.appendChild(tot);

    if (order.ship_name) {
      var addr = el("div", "addr");
      addr.appendChild(el("div", "muted", "Delivering to"));
      addr.appendChild(el("div", null, order.ship_name));
      if (order.ship_city) {
        addr.appendChild(el("div", null,
          [order.ship_city, order.ship_postal].filter(Boolean).join(", ")));
      }
      card.appendChild(addr);
    }

    var back = el("a", "btn", "Continue shopping");
    back.href = "/";
    card.appendChild(back);
  }

  fetch("/api/v1/config")
    .then(function (r) { return r.json(); })
    .then(function (c) {
      SYMBOL = c.currency_symbol || "£";
      document.title = "Thank you — " + c.store_name;
    })
    .catch(function () {});
})();
</script>
</body>
</html>
