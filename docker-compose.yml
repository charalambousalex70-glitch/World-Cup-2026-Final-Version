# Local development: Postgres + API in one command.
#   docker compose up --build
#   docker compose exec api python -m app.seed   # load demo data
#
# FIX: JWT_SECRET is no longer hardcoded here. Create a .env file in the
# repo root with JWT_SECRET=<your-local-dev-secret> instead, which docker
# compose picks up automatically. This prevents the pattern of copy-pasting
# a known-weak compose secret into production.
# A sample .env.example is provided in backend/ for reference.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweepstake
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sweepstake
      # JWT_SECRET: set this in a .env file in the repo root (never commit secrets)
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-do-not-use-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      FOOTBALL_API_KEY: ""   # blank = offline/demo mode
      AUTO_SEED: "true"       # load demo data automatically on local first boot
    ports: ["8000:8000"]

volumes:
  pgdata:
